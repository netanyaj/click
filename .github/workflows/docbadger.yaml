name: DocBadger

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # DocBadger diffs against the PR's base commit

      - uses:
          netanyaj/docbadger@main # no tagged release exists yet -- pin to a commit SHA
          # once one does (see Security below)
        with:
          llm_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          docs_path: "docs/quickstart.md,docs/commands.md,docs/commands-and-groups.md,docs/options.md,docs/parameters.md,docs/arguments.md,docs/prompts.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
